services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: superfercho-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-superfercho}
      POSTGRES_USER: ${POSTGRES_USER:-superfercho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superfercho}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - superfercho_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-superfercho} -d ${POSTGRES_DB:-superfercho}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  superfercho_postgres_data:
