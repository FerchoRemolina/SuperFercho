spring:
  application:
    name: superfercho
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    url: ${SUPERFERCHO_DB_URL:jdbc:postgresql://localhost:5432/superfercho}
    username: ${SUPERFERCHO_DB_USERNAME:superfercho}
    password: ${SUPERFERCHO_DB_PASSWORD:superfercho}
    driver-class-name: org.postgresql.Driver

server:
  port: ${SERVER_PORT:8080}

superfercho:
  currency: COP
  security:
    jwt:
      secret: ${SUPERFERCHO_JWT_SECRET}
      expiration: 20m
  knowledge:
    openai:
      api-key: ${OPENAI_API_KEY:}
      embeddings-url: ${SUPERFERCHO_OPENAI_EMBEDDINGS_URL:https://api.openai.com/v1/embeddings}
      model: text-embedding-3-small
  assistant:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat-url: ${SUPERFERCHO_OPENAI_CHAT_URL:https://api.openai.com/v1/chat/completions}
      model: ${SUPERFERCHO_OPENAI_CHAT_MODEL:gpt-4o-mini}
      connect-timeout: ${SUPERFERCHO_OPENAI_CHAT_CONNECT_TIMEOUT:5s}
      read-timeout: ${SUPERFERCHO_OPENAI_CHAT_READ_TIMEOUT:60s}
  catalog:
    openfoodfacts:
      base-url: ${SUPERFERCHO_OFF_BASE_URL:https://world.openfoodfacts.org}
      user-agent: ${SUPERFERCHO_OFF_USER_AGENT:SuperFercho/0.1 (https://github.com/FerchoRemolina/SuperFercho)}
