spring:
  datasource:
    url: ${SUPERFERCHO_DB_URL:jdbc:postgresql://localhost:5432/superfercho}
    username: ${SUPERFERCHO_DB_USERNAME:superfercho}
    password: ${SUPERFERCHO_DB_PASSWORD:superfercho}

superfercho:
  dev:
    admin:
      email: ${SUPERFERCHO_DEV_ADMIN_EMAIL:}
      password: ${SUPERFERCHO_DEV_ADMIN_PASSWORD:}
    demo-seed:
      enabled: ${SUPERFERCHO_DEV_DEMO_SEED:true}
